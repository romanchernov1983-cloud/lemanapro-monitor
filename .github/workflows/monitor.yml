name: Lemana PRO Monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Запустить тест
        run: python monitor.py
